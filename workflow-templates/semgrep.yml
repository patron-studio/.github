name: Semgrep

# Static analysis on PRs into main. Not a required check. Silence a safe call
# site with `// nosemgrep: <rule-id> -- <reason>` on the line above it.
#
# No Slack notifications, deliberately.

on:
  pull_request:
    branches: [main]
    # Docs-only PRs have nothing to analyse. Safe because this isn't required.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `semgrep ci` fails on any finding when there is no AppSec Platform
      # token.
      - name: Run Semgrep
        run: |
          semgrep ci \
            --config=p/typescript \
            --config=p/react \
            --config=p/nextjs \
            --config=p/owasp-top-ten \
            --config=p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
