name: Secret Scan

# Every branch push scans the commits it adds. PRs into main scan too: the
# required "Gitleaks" check must sit on the release PR's head SHA, and that
# SHA can have no push run, because a PR that auto-merge.yml lands in dev is
# merged by github-actions[bot] and GITHUB_TOKEN pushes start no workflows.
# Secrets already in history are not rescanned. False positives go in
# .gitleaksignore.
#
# No Slack notifications, deliberately.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes the in-flight scan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action lists a PR's commits through the API on pull_request.
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org secret; required for org-owned repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
