name: Auto-merge

# Arms GitHub auto-merge (merge commit) on every non-draft, human-authored PR
# into dev or staging when it's opened, reopened or marked ready for review.
# The merge happens once the "Protect dev and staging" ruleset's required
# checks pass: this workflow is the trigger, the ruleset is the gate.
#
# Merge commit, never squash: a squashed branch that's later promoted
# conflicts on every file both sides touched (docs/repo-standard.md in
# patron-studio/.github).
#
# Escape hatch: open the PR as a draft. Bot-authored PRs are excluded so they
# get a human look first.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [dev, staging]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Arm auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
